<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Ivy · Hotel Room Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Casa Ivy <span>Hotel</span></h1>
    <p>Book a room in three steps: pick a room, choose your dates, confirm.</p>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>1. Choose a room</h2>
      <div id="rooms" class="rooms"></div>

      <h2>2. Stay details</h2>
      <form id="booking-form" novalidate>
        <div class="row">
          <label>Check-in
            <input type="date" id="checkin" required>
          </label>
          <label>Check-out
            <input type="date" id="checkout" required>
          </label>
        </div>
        <div class="row">
          <label>Guests
            <input type="number" id="guests" min="1" max="5" value="1" required>
          </label>
          <label>Full name
            <input type="text" id="name" placeholder="Juan Dela Cruz" required>
          </label>
        </div>
        <label>Email
          <input type="email" id="email" placeholder="juan@email.com" required>
